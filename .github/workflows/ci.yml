name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pocketbook:
    name: Build & Test PocketBook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install ARM cross-compiler and tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++-arm-linux-gnueabi

      - name: Build C++ Static ARM Renderer
        run: |
          arm-linux-gnueabi-g++ -static -std=gnu++17 -O2 -DNATIVE_BUILD \
            -Ifirmware/src -Ifirmware/test/test_config \
            -Ipocketbook/libs/qrcode -Ipocketbook/libs/arduinojson \
            pocketbook/tablo_render.cpp \
            firmware/src/layout.cpp firmware/src/canvas.cpp firmware/src/canvas_mem.cpp \
            firmware/src/font.cpp firmware/src/i18n.cpp firmware/src/slots.cpp \
            firmware/src/wifi_qr.cpp firmware/src/widgets/types.cpp \
            firmware/src/widgets/prims.cpp firmware/src/widgets/w_markets.cpp \
            firmware/src/widgets/w_limits.cpp firmware/src/widgets/w_air.cpp \
            firmware/src/widgets/w_limits_air.cpp firmware/src/widgets/w_mail.cpp \
            firmware/src/widgets/w_today.cpp firmware/src/widgets/w_metric.cpp \
            firmware/src/widgets/w_text.cpp firmware/src/widgets/registry.cpp \
            pocketbook/libs/qrcode/qrcode.c \
            -o pocketbook/tablo_render_arm

      - name: Build C++ Host Renderer
        run: |
          g++ -std=gnu++17 -O2 -DNATIVE_BUILD \
            -Ifirmware/src -Ifirmware/test/test_config \
            -Ipocketbook/libs/qrcode -Ipocketbook/libs/arduinojson \
            pocketbook/tablo_render.cpp \
            firmware/src/layout.cpp firmware/src/canvas.cpp firmware/src/canvas_mem.cpp \
            firmware/src/font.cpp firmware/src/i18n.cpp firmware/src/slots.cpp \
            firmware/src/wifi_qr.cpp firmware/src/widgets/types.cpp \
            firmware/src/widgets/prims.cpp firmware/src/widgets/w_markets.cpp \
            firmware/src/widgets/w_limits.cpp firmware/src/widgets/w_air.cpp \
            firmware/src/widgets/w_limits_air.cpp firmware/src/widgets/w_mail.cpp \
            firmware/src/widgets/w_today.cpp firmware/src/widgets/w_metric.cpp \
            firmware/src/widgets/w_text.cpp firmware/src/widgets/registry.cpp \
            pocketbook/libs/qrcode/qrcode.c \
            -o pocketbook/tablo_render_host

      - name: Test Frame Rendering
        run: |
          ./pocketbook/tablo_render_host \
            -config pocketbook/default_config.json \
            -setup \
            -setup-url "http://pb-tablo.local:8080" \
            -out /tmp/test_boot.png \
            -rot right
          test -s /tmp/test_boot.png

      - name: Build Go Host Daemon
        run: |
          cd pocketbook/daemon
          go build -v -o ../tablo_daemon_host main.go

      - name: Build Go Static ARM Daemon
        run: |
          cd pocketbook/daemon
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o ../tablo_daemon_arm main.go
          test -s ../tablo_daemon_arm
