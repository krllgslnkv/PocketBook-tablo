name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pocketbook:
    name: Build PocketBook Release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM cross-compiler and tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++-arm-linux-gnueabi zip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build C++ Static ARM and Host Renderers
        run: |
          # 1. ARM renderer for PocketBook
          arm-linux-gnueabi-g++ -static -std=gnu++17 -O2 -DNATIVE_BUILD \
            -Ifirmware/src -Ifirmware/test/test_config \
            -Ipocketbook/libs/qrcode -Ipocketbook/libs/arduinojson \
            pocketbook/tablo_render.cpp \
            firmware/src/layout.cpp firmware/src/canvas.cpp firmware/src/canvas_mem.cpp \
            firmware/src/font.cpp firmware/src/i18n.cpp firmware/src/slots.cpp \
            firmware/src/wifi_qr.cpp firmware/src/widgets/types.cpp \
            firmware/src/widgets/prims.cpp firmware/src/widgets/w_markets.cpp \
            firmware/src/widgets/w_limits.cpp firmware/src/widgets/w_air.cpp \
            firmware/src/widgets/w_limits_air.cpp firmware/src/widgets/w_mail.cpp \
            firmware/src/widgets/w_today.cpp firmware/src/widgets/w_metric.cpp \
            firmware/src/widgets/w_text.cpp firmware/src/widgets/registry.cpp \
            pocketbook/libs/qrcode/qrcode.c \
            -o pocketbook/tablo_render_arm

          # 2. Host renderer for generating initial boot/setup image
          g++ -std=gnu++17 -O2 -DNATIVE_BUILD \
            -Ifirmware/src -Ifirmware/test/test_config \
            -Ipocketbook/libs/qrcode -Ipocketbook/libs/arduinojson \
            pocketbook/tablo_render.cpp \
            firmware/src/layout.cpp firmware/src/canvas.cpp firmware/src/canvas_mem.cpp \
            firmware/src/font.cpp firmware/src/i18n.cpp firmware/src/slots.cpp \
            firmware/src/wifi_qr.cpp firmware/src/widgets/types.cpp \
            firmware/src/widgets/prims.cpp firmware/src/widgets/w_markets.cpp \
            firmware/src/widgets/w_limits.cpp firmware/src/widgets/w_air.cpp \
            firmware/src/widgets/w_limits_air.cpp firmware/src/widgets/w_mail.cpp \
            firmware/src/widgets/w_today.cpp firmware/src/widgets/w_metric.cpp \
            firmware/src/widgets/w_text.cpp firmware/src/widgets/registry.cpp \
            pocketbook/libs/qrcode/qrcode.c \
            -o pocketbook/tablo_render_host

      - name: Build Go Static ARM Daemon
        run: |
          cd pocketbook/daemon
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o ../tablo_daemon_arm main.go

      - name: Package PocketBook Distribution and OTA Archive
        run: |
          set -euo pipefail
          DIST="dist_pb"
          rm -rf "$DIST"
          mkdir -p "$DIST/applications/.tablo/bin"
          mkdir -p "$DIST/applications/.tablo/data"
          mkdir -p "$DIST/Photo"

          cp pocketbook/tablo_render_arm "$DIST/applications/.tablo/bin/tablo_render"
          cp pocketbook/tablo_daemon_arm "$DIST/applications/.tablo/bin/tablo_daemon"
          chmod +x "$DIST/applications/.tablo/bin/"*

          cp pocketbook/daemon/index.html "$DIST/applications/.tablo/data/index.html"
          cp pocketbook/default_config.json "$DIST/applications/.tablo/config.json"
          cp pocketbook/default_config.json "$DIST/tablo_config.json"

          # Render boot / setup image
          ./pocketbook/tablo_render_host \
            -config pocketbook/default_config.json \
            -setup \
            -setup-url "http://pb-tablo.local:8080" \
            -out "$DIST/Photo/tablo_live.png" \
            -rot right
          cp "$DIST/Photo/tablo_live.png" "$DIST/applications/.tablo/tablo_live.png"

          # Create Tablo.app launcher script
          cat << 'EOF' > "$DIST/applications/Tablo.app"
          #!/bin/sh
          TABLO_DIR="/mnt/ext1/applications/.tablo"
          CONFIG="/mnt/ext1/tablo_config.json"
          if [ ! -f "$CONFIG" ]; then
              CONFIG="$TABLO_DIR/config.json"
          fi
          IMG="/mnt/ext1/Photo/tablo_live.png"
          LOG="/tmp/tablo.log"
          echo "=== TABLO LAUNCH $(date) ===" >> "$LOG"
          mkdir -p /mnt/ext1/Photo
          if [ ! -s "$IMG" ] && [ -s "$TABLO_DIR/tablo_live.png" ]; then
              cp "$TABLO_DIR/tablo_live.png" "$IMG"
          fi
          DAEMON_RUNNING=0
          if killall -0 tablo_daemon 2>/dev/null || pidof tablo_daemon >/dev/null 2>&1; then
              DAEMON_RUNNING=1
          fi
          if [ "$DAEMON_RUNNING" -eq 0 ]; then
              echo "Starting autonomous background daemon..." >> "$LOG"
              if [ -x /ebrmain/bin/netagent ]; then
                  /ebrmain/bin/netagent wifi on >> "$LOG" 2>&1
                  /ebrmain/bin/netagent net on >> "$LOG" 2>&1
                  /ebrmain/bin/netagent connect >> "$LOG" 2>&1
              fi
              if [ -x /ebrmain/bin/netconnect ]; then
                  /ebrmain/bin/netconnect >> "$LOG" 2>&1
              fi
              iwconfig wlan0 power off 2>/dev/null || true
              nohup "$TABLO_DIR/bin/tablo_daemon" \
                  -port 8080 \
                  -config "$CONFIG" \
                  -html "$TABLO_DIR/data/index.html" \
                  -renderer "$TABLO_DIR/bin/tablo_render" \
                  -img "$IMG" \
                  -rot right >> "$LOG" 2>&1 &
          fi
          if [ -s "$IMG" ]; then
              killall -TERM picviewer.app 2>/dev/null || true
              for i in 1 2 3; do
                  if ! killall -0 picviewer.app 2>/dev/null; then break; fi
                  usleep 80000
              done
              killall -9 picviewer.app 2>/dev/null || true
              usleep 150000
              /ebrmain/bin/openbook "$IMG" >> "$LOG" 2>&1
          fi
          EOF
          chmod +x "$DIST/applications/Tablo.app"

          # 1. OTA update archive (consumed directly by PocketBook over Wi-Fi)
          (cd "$DIST" && tar -czf update.tar.gz -C applications Tablo.app -C .tablo bin data)

          # 2. Complete ZIP package for manual USB installation
          (cd "$DIST" && zip -r "PocketBook-tablo-${TAG:-latest}.zip" applications tablo_config.json Photo)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            dist_pb/update.tar.gz
            dist_pb/PocketBook-tablo-*.zip
